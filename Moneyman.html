<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Moneyman</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #000;
  --card: #151515;
  --card-2: #242424;
  --red-dark: #730000;
  --red-card: #6d0000;
  --red: #f00;
  --red-fill: #9e0000;
  --yellow: #fc0;
  --muted: #999797;
  --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; background: var(--bg); }
body {
  margin: 0;
  background: var(--bg);
  color: #fff;
  font: 400 13px / 1.25 var(--font);
  -webkit-font-smoothing: antialiased;
}
body.modal-open { overflow: hidden; }
svg { display: block; flex: none; }
p { margin: 0; }
:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }

.frame {
  --u: calc(100cqw / 412);
  container-type: inline-size;
  display: flex;
  flex-direction: column;
  width: min(100%, 560px);
  min-height: 100dvh;
  margin-inline: auto;
}

.app {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 0 calc(var(--u) * 7) calc(var(--u) * 10);
}

.top {
  display: grid;
  grid-template-rows: calc(var(--u) * 33) calc(var(--u) * 80) calc(var(--u) * 120) calc(var(--u) * 112);
  height: calc(var(--u) * 428 + env(safe-area-inset-top, 0px));
  margin-inline: calc(var(--u) * -7);
  padding: calc(var(--u) * 51 + env(safe-area-inset-top, 0px)) calc(var(--u) * 23) 0;
  background: linear-gradient(146.83deg, #242424 0%, #121212 17.43%, #000 100%) 0 calc(var(--u) * -15) / 100% calc(var(--u) * 447) no-repeat;
  border-radius: 0 0 calc(var(--u) * 50) calc(var(--u) * 50);
}
.net-label {
  text-align: center;
  font-size: calc(var(--u) * 20);
  line-height: calc(var(--u) * 24);
  color: var(--muted);
}
.net-value {
  text-align: center;
  white-space: nowrap;
  font-size: calc(var(--u) * 50);
  font-weight: 600;
  line-height: calc(var(--u) * 61);
  color: #fffefe;
}

.budget {
  position: relative;
  height: calc(var(--u) * 110);
  background: var(--red-dark);
  border-radius: calc(var(--u) * 28);
  overflow: hidden;
  font-size: calc(var(--u) * 15);
}
.budget-title,
.budget-period,
.budget-limit { position: absolute; white-space: nowrap; }
.budget-title  { left: calc(var(--u) * 27); top: calc(var(--u) * 20); line-height: calc(var(--u) * 18); }
.budget-period { left: calc(var(--u) * 258); top: calc(var(--u) * 19); line-height: calc(var(--u) * 20); }
.budget-toggle {
  position: absolute;
  left: calc(var(--u) * 318);
  top: calc(var(--u) * 20);
  width: calc(var(--u) * 17.49);
  height: calc(var(--u) * 18.4);
  padding: 0;
  border: 0;
  background: none;
  color: inherit;
  cursor: pointer;
}
.budget-toggle svg { width: 100%; height: 100%; }
.budget-limit {
  left: calc(var(--u) * 26);
  top: calc(var(--u) * 47);
  font-size: calc(var(--u) * 32);
  font-weight: 600;
  line-height: calc(var(--u) * 38);
}
.meter {
  position: absolute;
  left: calc(var(--u) * 186);
  top: calc(var(--u) * 52);
  width: calc(var(--u) * 154);
  height: calc(var(--u) * 27.72);
  background: #fff;
  border-radius: calc(var(--u) * 105);
  box-shadow: 0 calc(var(--u) * 5) calc(var(--u) * 4) rgba(0, 0, 0, .25);
  overflow: hidden;
  font-size: calc(var(--u) * 10);
}
.meter-fill {
  position: absolute;
  inset: 0 auto 0 0;
  width: var(--progress);
  background: var(--red-fill);
  border-radius: inherit;
}
.meter-used, .meter-pct {
  position: absolute;
  top: 50%;
  translate: 0 -50%;
  line-height: calc(var(--u) * 13.35);
}
.meter-used { left: calc(var(--u) * 13.27); font-weight: 600; color: #fff; }
.meter-pct  { right: calc(var(--u) * 10); font-weight: 700; color: var(--red-dark); }

.actions {
  display: grid;
  grid-template-columns: repeat(3, calc(var(--u) * 114));
  gap: calc(var(--u) * 9);
  margin: 0;
  padding: 0;
  list-style: none;
}
.action {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: calc(var(--u) * 114);
  height: calc(var(--u) * 112);
  padding: 0;
  background: var(--card-2);
  border: 0;
  border-radius: calc(var(--u) * 28);
  color: inherit;
  font: inherit;
  font-size: calc(var(--u) * 13);
  text-align: center;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  transition: background-color .15s;
}
@media (hover: hover) {
  .action:hover { background: #2e2e2e; }
}
.action svg {
  margin-top: calc(var(--u) * var(--it));
  width: calc(var(--u) * var(--ih));
  height: calc(var(--u) * var(--ih));
}
.action span {
  margin-top: calc(var(--u) * var(--lt));
  line-height: calc(var(--u) * 18);
  white-space: nowrap;
}

.invest {
  display: flex;
  flex-direction: column;
  align-items: center;
  height: calc(var(--u) * 91);
  margin-top: calc(var(--u) * 7);
  padding-top: calc(var(--u) * 13);
  background: var(--card);
  border-radius: calc(var(--u) * 28);
  font-size: calc(var(--u) * 13);
  overflow: hidden;
}
.invest span { line-height: calc(var(--u) * 18); }
.invest strong {
  margin-top: calc(var(--u) * -5);
  font-size: calc(var(--u) * 40);
  font-weight: 600;
  line-height: calc(var(--u) * 43);
  white-space: nowrap;
}

.stats {
  position: relative;
  height: calc(var(--u) * 170);
  margin-top: calc(var(--u) * 7);
  background: linear-gradient(180.83deg, #151515 0%, #000 100%);
  border-radius: calc(var(--u) * 28);
  overflow: hidden;
}
.chart {
  position: absolute;
  inset: 0 auto 0 calc(var(--u) * 36);
  display: grid;
  grid-template-columns: repeat(3, calc(var(--u) * 44));
  column-gap: calc(var(--u) * 17);
  align-items: end;
  margin: 0;
  padding: 0;
  list-style: none;
}
.bar {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
  gap: calc(var(--u) * 6);
  font-size: calc(var(--u) * 11);
  line-height: calc(var(--u) * 13);
  white-space: nowrap;
}
.bar::after {
  content: "";
  width: 100%;
  height: calc(var(--u) * var(--h));
  background: var(--c);
  border-radius: calc(var(--u) * var(--r, 4)) calc(var(--u) * var(--r, 4)) 0 0;
}
.bar > span { order: -1; }

.legend {
  position: absolute;
  left: calc(var(--u) * 270);
  top: calc(var(--u) * 46);
  display: grid;
  gap: calc(var(--u) * 12);
  margin: 0;
  padding: 0;
  list-style: none;
  font-size: calc(var(--u) * 11);
}
.legend li {
  display: flex;
  align-items: center;
  gap: calc(var(--u) * 7);
  height: calc(var(--u) * 18);
}
.legend li::before {
  content: "";
  width: calc(var(--u) * 18);
  height: calc(var(--u) * 18);
  background: var(--c);
}

.cash {
  display: grid;
  grid-template-columns: repeat(2, calc(var(--u) * 196));
  gap: calc(var(--u) * 6);
  margin-top: calc(var(--u) * 10);
}
.cash-in, .cash-out {
  display: grid;
  grid-template-columns: auto auto;
  grid-template-rows: calc(var(--u) * 14) auto;
  justify-content: center;
  align-content: start;
  align-items: center;
  column-gap: calc(var(--u) * 6);
  height: calc(var(--u) * 116);
  border-radius: calc(var(--u) * 30);
  text-align: center;
  overflow: hidden;
}
.cash-in  { background: var(--red-card); padding-top: calc(var(--u) * 31); }
.cash-out { background: var(--card);     padding-top: calc(var(--u) * 28); }
.cash-label { grid-area: 1 / 1; font-size: calc(var(--u) * 11); white-space: nowrap; }
.cash-in svg, .cash-out svg { grid-area: 1 / 2; width: calc(var(--u) * 14); height: calc(var(--u) * 14); }
.cash-amount {
  grid-area: 2 / 1 / 3 / -1;
  font-size: calc(var(--u) * 28);
  line-height: calc(var(--u) * 34);
  white-space: nowrap;
}

.nav {
  position: sticky;
  bottom: 0;
  z-index: 10;
  display: grid;
  place-items: center;
  height: calc(var(--u) * 78 + env(safe-area-inset-bottom, 0px));
  padding-bottom: env(safe-area-inset-bottom, 0px);
  background: #222;
  border-radius: calc(var(--u) * 22) calc(var(--u) * 22) 0 0;
  color: #fff;
  font-size: calc(var(--u) * 24);
  font-weight: 700;
  text-decoration: none;
}

.tp-overlay {
  position: fixed;
  inset: 0;
  z-index: 30;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  background: rgba(0, 0, 0, .6);
}
.tp-overlay[hidden] { display: none; }
.tp-overlay:not([hidden]) { animation: tp-fade .2s ease-out; }
.tp-overlay:not([hidden]) .tp-wrap { animation: tp-slide .3s cubic-bezier(.2, .8, .2, 1); }

.tp-wrap {
  container-type: inline-size;
  width: min(100%, 560px, 72dvh);
}
.tp-wrap::after {
  content: "";
  display: block;
  height: env(safe-area-inset-bottom, 0px);
  background: #151515;
}

.tp, .tp * { box-sizing: border-box; }
.tp {
  --u: calc(100cqw / 412);
  position: relative;
  height: calc(var(--u) * 571);
  background: #151515;
  border-radius: calc(var(--u) * 60) calc(var(--u) * 60) 0 0;
  color: #fff;
  font-family: var(--font);
  overflow: hidden;
  -webkit-user-select: none;
  user-select: none;
}
.tp [hidden] { display: none !important; }
.tp button {
  font-family: inherit;
  color: inherit;
  border: 0;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
.tp-view { position: absolute; inset: 0; }

.tp-display {
  position: absolute;
  inset: 0 0 auto 0;
  height: calc(var(--u) * 201);
  display: grid;
  place-items: center;
  padding: calc(var(--u) * 30) calc(var(--u) * 20) 0;
  background: rgba(0, 0, 0, .42);
  border-radius: 0 0 calc(var(--u) * 50) calc(var(--u) * 50);
}
.tp-amount {
  max-width: 100%;
  font-size: calc(var(--u) * var(--fs, 48));
  font-weight: 700;
  line-height: 1.2;
  white-space: nowrap;
  text-align: center;
}

.tp-keys {
  position: absolute;
  left: calc(var(--u) * 13);
  top: calc(var(--u) * 211);
  width: calc(var(--u) * 385);
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: calc(var(--u) * 16) calc(var(--u) * 15);
}
.tp-key {
  height: calc(var(--u) * 56);
  padding: 0;
  display: grid;
  place-items: center;
  background: linear-gradient(180deg, #3f3f3f 0%, #0b0b0b 100%);
  border-radius: calc(var(--u) * 5);
  font-size: calc(var(--u) * 24);
  font-weight: 700;
  transition: transform .08s, filter .08s;
}
.tp-key svg { width: calc(var(--u) * 24); height: calc(var(--u) * 24); }
.tp-key:active { transform: scale(.96); filter: brightness(1.3); }

.tp-primary {
  height: calc(var(--u) * 56);
  background: #b88d00;
  border-radius: calc(var(--u) * 5);
  font-size: calc(var(--u) * 16);
  font-weight: 700;
  transition: opacity .15s, transform .08s;
}
.tp-primary:active:not(:disabled) { transform: scale(.98); }
.tp-primary:disabled { opacity: .4; cursor: not-allowed; }
.tp-keys .tp-primary { grid-column: 1 / span 3; }

.tp-head {
  position: absolute;
  inset: 0 0 auto 0;
  height: calc(var(--u) * 96);
  display: grid;
  place-content: center;
  justify-items: center;
  gap: calc(var(--u) * 2);
  padding-top: calc(var(--u) * 6);
  background: rgba(0, 0, 0, .42);
  border-radius: 0 0 calc(var(--u) * 36) calc(var(--u) * 36);
}
.tp-head small {
  font-size: calc(var(--u) * 13);
  letter-spacing: .02em;
  color: var(--muted);
}
.tp-head strong {
  font-size: calc(var(--u) * 32);
  font-weight: 700;
  line-height: 1.2;
}

.tp-back {
  position: absolute;
  left: calc(var(--u) * 20);
  top: calc(var(--u) * 14);
  z-index: 2;
  width: calc(var(--u) * 36);
  height: calc(var(--u) * 36);
  padding: 0;
  display: grid;
  place-items: center;
  background: none;
  border-radius: 50%;
}
.tp-back svg { width: calc(var(--u) * 24); height: calc(var(--u) * 24); }

.tp-cats {
  position: absolute;
  left: calc(var(--u) * 13);
  top: calc(var(--u) * 110);
  width: calc(var(--u) * 385);
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  grid-auto-rows: calc(var(--u) * 172);
  gap: calc(var(--u) * 14);
}
.tp-cat {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: calc(var(--u) * 3);
  padding: 0;
  background: linear-gradient(180deg, #252525 0%, #1a1a1a 100%);
  border-radius: calc(var(--u) * 28);
  box-shadow: inset 0 0 0 calc(var(--u) * 2) transparent;
  transition: background .2s, box-shadow .2s, transform .1s;
  animation: tp-rise .35s cubic-bezier(.2, .8, .2, 1) backwards;
  animation-delay: calc(var(--i, 0) * 50ms);
}
.tp-cat:active { transform: scale(.97); }

.tp-badge {
  display: grid;
  place-items: center;
  width: calc(var(--u) * 80);
  height: calc(var(--u) * 80);
  margin-bottom: calc(var(--u) * 10);
  border-radius: 50%;
  color: var(--a);
  background: color-mix(in srgb, var(--a) 16%, transparent);
  transition: background-color .2s, color .2s;
}
.tp-badge svg { width: calc(var(--u) * 40); height: calc(var(--u) * 40); }
.tp-name {
  font-size: calc(var(--u) * 19);
  font-weight: 600;
  line-height: 1.2;
}
.tp-sub {
  font-size: calc(var(--u) * 12);
  color: var(--muted);
}
.tp-check {
  position: absolute;
  top: calc(var(--u) * 14);
  right: calc(var(--u) * 14);
  display: grid;
  place-items: center;
  width: calc(var(--u) * 26);
  height: calc(var(--u) * 26);
  border-radius: 50%;
  background: var(--a);
  color: var(--on);
  opacity: 0;
  scale: .5;
  transition: opacity .15s, scale .25s cubic-bezier(.3, 1.6, .5, 1);
}
.tp-check svg { width: calc(var(--u) * 15); height: calc(var(--u) * 15); }

.tp-cat[aria-pressed="true"] {
  background: color-mix(in srgb, var(--a) 13%, #1a1a1a);
  box-shadow:
    inset 0 0 0 calc(var(--u) * 2) var(--a),
    0 0 calc(var(--u) * 22) color-mix(in srgb, var(--a) 24%, transparent);
}
.tp-cat[aria-pressed="true"] .tp-badge { background: var(--a); color: var(--on); }
.tp-cat[aria-pressed="true"] .tp-check { opacity: 1; scale: 1; }

.tp-confirm {
  position: absolute;
  left: calc(var(--u) * 13);
  top: calc(var(--u) * 481);
  width: calc(var(--u) * 385);
  height: calc(var(--u) * 66);
}

@keyframes tp-fade  { from { opacity: 0; } }
@keyframes tp-slide { from { transform: translateY(100%); } }
@keyframes tp-rise  { from { opacity: 0; transform: translateY(8%) scale(.96); } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    transition: none !important;
    animation: none !important;
  }
}
</style>
</head>

<body>
<div class="frame">
<main class="app">

  <section class="top" aria-label="Ringkasan">
    <p class="net-label">Net Worth</p>
    <p class="net-value">Rp 1.300.000</p>

    <div class="budget" style="--progress: 60.4%">
      <span class="budget-title">Budget</span>
      <span class="budget-period">Monthly</span>
      <button class="budget-toggle" type="button" aria-label="Change budget period">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <p class="budget-limit">500.000</p>
      <div class="meter" role="progressbar" aria-label="Budget used" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50">
        <div class="meter-fill"></div>
        <span class="meter-used">250.000</span>
        <span class="meter-pct">50%</span>
      </div>
    </div>

    <ul class="actions">
      <li>
        <button class="action" type="button" data-action="transaction" style="--it: 24; --ih: 40; --lt: 9">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
          <span>Transaction</span>
        </button>
      </li>
      <li>
        <button class="action" type="button" style="--it: 23; --ih: 40; --lt: 10">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/></svg>
          <span>Income</span>
        </button>
      </li>
      <li>
        <button class="action" type="button" style="--it: 15; --ih: 48; --lt: 11">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20V10M18 20V4M6 20v-4"/></svg>
          <span>Investment</span>
        </button>
      </li>
    </ul>
  </section>

  <section class="invest" aria-label="Investment total">
    <span>Investment Total</span>
    <strong>Rp 124.500</strong>
  </section>

  <section class="stats" aria-label="Spending by category">
    <ul class="chart">
      <li class="bar" style="--h: 103; --r: 6; --c: var(--red)"><span>Rp 130.000</span></li>
      <li class="bar" style="--h: 134; --c: #fff"><span>Rp 150.000</span></li>
      <li class="bar" style="--h: 76; --c: var(--yellow)"><span>Rp 80.000</span></li>
    </ul>
    <ul class="legend">
      <li style="--c: #fb0000">Foods</li>
      <li style="--c: #d9d9d9">Transport</li>
      <li style="--c: var(--yellow)">Needs</li>
    </ul>
  </section>

  <div class="cash">
    <section class="cash-in" aria-label="Money income">
      <p class="cash-label">Money Income</p>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 7 7 17M17 17H7V7"/></svg>
      <p class="cash-amount">Rp 1.000.000</p>
    </section>

    <section class="cash-out" aria-label="Expenses">
      <p class="cash-label">Expenses</p>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M7 7h10v10"/></svg>
      <p class="cash-amount">Rp 250.000</p>
    </section>
  </div>

</main>

<a class="nav" href="#">Switch to Workout</a>
</div>

<div class="tp-overlay" id="tpOverlay" hidden>
  <div class="tp-wrap" role="dialog" aria-modal="true" aria-label="Add transaction">
    <div class="tp" id="tp">

      <section class="tp-view" id="tpKeypad">
        <div class="tp-display">
          <p class="tp-amount" id="tpAmount">Rp 0</p>
        </div>

        <div class="tp-keys">
          <button class="tp-key" type="button" data-key="1">1</button>
          <button class="tp-key" type="button" data-key="2">2</button>
          <button class="tp-key" type="button" data-key="3">3</button>
          <button class="tp-key" type="button" data-key="4">4</button>
          <button class="tp-key" type="button" data-key="5">5</button>
          <button class="tp-key" type="button" data-key="6">6</button>
          <button class="tp-key" type="button" data-key="7">7</button>
          <button class="tp-key" type="button" data-key="8">8</button>
          <button class="tp-key" type="button" data-key="9">9</button>
          <button class="tp-key" type="button" data-key="0">0</button>
          <button class="tp-key" type="button" data-key="000">000</button>
          <button class="tp-key" type="button" data-key="del" aria-label="Delete">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2Z"/><path d="m18 9-6 6M12 9l6 6"/></svg>
          </button>
          <button class="tp-primary" type="button" id="tpReview" disabled>Review Transaction</button>
        </div>
      </section>

      <section class="tp-view" id="tpCategory" hidden>
        <div class="tp-head">
          <small>Choose a category</small>
          <strong id="tpSummary">Rp 0</strong>
        </div>

        <button class="tp-back" type="button" id="tpBack" aria-label="Back">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
        </button>

        <div class="tp-cats">
          <button class="tp-cat" type="button" data-cat="Foods" aria-pressed="false" style="--a: #fb0000; --on: #fff; --i: 0">
            <span class="tp-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5L20 7"/></svg></span>
            <span class="tp-badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></svg></span>
            <span class="tp-name">Foods</span>
          </button>

          <button class="tp-cat" type="button" data-cat="Transport" aria-pressed="false" style="--a: #d9d9d9; --on: #000; --i: 1">
            <span class="tp-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5L20 7"/></svg></span>
            <span class="tp-badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/></svg></span>
            <span class="tp-name">Transport</span>
          </button>

          <button class="tp-cat" type="button" data-cat="Needs" aria-pressed="false" style="--a: #fc0; --on: #000; --i: 2">
            <span class="tp-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5L20 7"/></svg></span>
            <span class="tp-badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg></span>
            <span class="tp-name">Needs</span>
          
          </button>

          <button class="tp-cat" type="button" data-cat="Wants" aria-pressed="false" style="--a: #ff8a00; --on: #000; --i: 3">
            <span class="tp-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5L20 7"/></svg></span>
            <span class="tp-badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13"/><path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5A4.8 8 0 0 1 12 8a4.8 8 0 0 1 4.5-5 2.5 2.5 0 0 1 0 5"/></svg></span>
            <span class="tp-name">Wants</span>
            
          </button>
        </div>

        <button class="tp-primary tp-confirm" type="button" id="tpConfirm" disabled>Confirm</button>
      </section>

    </div>
  </div>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const overlay = $("tpOverlay");
  const root = $("tp");
  const keypad = $("tpKeypad");
  const category = $("tpCategory");
  const amountEl = $("tpAmount");
  const summaryEl = $("tpSummary");
  const reviewBtn = $("tpReview");
  const confirmBtn = $("tpConfirm");
  const openBtn = document.querySelector('[data-action="transaction"]');
  const cats = [...root.querySelectorAll(".tp-cat")];

  const MAX_DIGITS = 12;
  let digits = "";
  let selected = null;

  const money = () => "Rp " + (digits ? digits.replace(/\B(?=(\d{3})+(?!\d))/g, ".") : "0");

  const render = () => {
    const len = digits.length;
    amountEl.textContent = money();
    amountEl.style.setProperty("--fs", len > 11 ? 30 : len > 9 ? 36 : len > 7 ? 42 : 48);
    reviewBtn.disabled = !digits;
  };

  const setView = (name) => {
    keypad.hidden = name !== "keypad";
    category.hidden = name !== "category";
  };

  const select = (name) => {
    selected = name;
    cats.forEach((btn) => btn.setAttribute("aria-pressed", String(btn.dataset.cat === name)));
    confirmBtn.disabled = !name;
  };

  const reset = () => {
    digits = "";
    select(null);
    render();
    setView("keypad");
  };

  const open = () => {
    overlay.hidden = false;
    document.body.classList.add("modal-open");
  };

  const close = () => {
    overlay.hidden = true;
    document.body.classList.remove("modal-open");
    reset();
  };

  const press = (key) => {
    if (key === "del") {
      digits = digits.slice(0, -1);
    } else {
      if (!digits && (key === "0" || key === "000")) return;
      if (digits.length + key.length > MAX_DIGITS) return;
      digits += key;
    }
    render();
  };

  const review = () => {
    if (!digits) return;
    summaryEl.textContent = money();
    setView("category");
  };

  const confirm = () => {
    if (!digits || !selected) return;
    root.dispatchEvent(new CustomEvent("transactionconfirm", {
      bubbles: true,
      detail: { amount: Number(digits), category: selected }
    }));
    close();
  };

  openBtn.addEventListener("click", open);
  overlay.addEventListener("click", (e) => { if (e.target === overlay) close(); });
  reviewBtn.addEventListener("click", review);
  confirmBtn.addEventListener("click", confirm);
  $("tpBack").addEventListener("click", () => setView("keypad"));

  root.addEventListener("click", (e) => {
    const key = e.target.closest(".tp-key");
    if (key) return press(key.dataset.key);
    const cat = e.target.closest(".tp-cat");
    if (cat) select(cat.dataset.cat);
  });

  document.addEventListener("keydown", (e) => {
    if (overlay.hidden || e.ctrlKey || e.metaKey || e.altKey) return;
    const onKeypad = !keypad.hidden;

    if (e.key === "Escape") {
      onKeypad ? close() : setView("keypad");
    } else if (e.key === "Enter") {
      e.preventDefault();
      onKeypad ? review() : confirm();
    } else if (onKeypad && e.key === "Backspace") {
      e.preventDefault();
      press("del");
    } else if (onKeypad && /^\d$/.test(e.key)) {
      e.preventDefault();
      press(e.key);
    }
  });

  render();
})();
</script>
</body>
</html>
